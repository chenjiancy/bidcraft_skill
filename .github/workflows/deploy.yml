name: Deploy to Production

# 云端正向：CI（ci.yml 三塔层测试）全部通过后，才在本机 self-hosted runner 上部署到生产环境。
# 生产环境 E:\标书匠生产 是独立 git 仓库（sparse-checkout 只检出发布文件），
# 部署 = 执行其目录内升级生产.ps1（防污染检查 → HTTPS+token 拉取 main → 冒烟 → 记录版本）。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 手动触发入口（故障恢复：workflow_run 事件丢失时可手动补部署）
  workflow_dispatch:

# 权限最小化：部署只需读取代码（fetch/pull 为只读操作）
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - name: 部署到生产环境
        # runner 服务账户 ExecutionPolicy=Restricted，PowerShell dot-source 受限；
        # 用 cmd 调 powershell.exe 子进程（-ExecutionPolicy Bypass）执行升级脚本
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "E:\标书匠生产\升级生产.ps1"

      # 部署失败通知：自动开 Issue（生产未更新是最严重问题，必须可见）
      - name: 部署失败通知（自动开 Issue）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const open = await github.rest.issues.listForRepo({owner, repo, state:'open', labels:['deploy-failure']});
            if (open.data.length > 0) {
              console.log('已有未关闭的部署失败 Issue，跳过');
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `部署失败：${context.runId}`,
                body: `生产环境自动部署失败，请查看：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                labels: ['deploy-failure']
              });
              console.log('已创建部署失败 Issue');
            }
