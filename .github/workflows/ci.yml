name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发入口（故障恢复：GitHub 偶发事件丢失时可手动补跑 CI）
  workflow_dispatch:

# 权限最小化：CI 只读代码，无任何写权限
permissions:
  contents: read

jobs:
  # 测试金字塔：L1 单元(最多最快) → L2 集成 → L3 端到端(最少最慢)
  # ⑪ 聚焦本机生产环境（Windows + Python 3.12，与 C:\Python312 一致）；矩阵变体会使
  #    分支保护的状态检查按变体展开成多个 check，维护成本高 → 用单 job 保证 check 名稳定。
  test-pyramid:
    # fork PR 来源限定：外部 fork 的 PR 不消耗本仓库 Actions 分钟数
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 运行依赖：python-docx(模板/填充/docx读写)、Pillow(图框预览)。
      # 可选依赖不进 CI：PyMuPDF(PDF解析)、rapidocr(OCR)，均有函数级容错回退。
      - name: 安装运行依赖
        run: python -m pip install python-docx Pillow

      # 零外部依赖的测试框架：全部基于 Python 标准库 unittest，保证跨环境/平台可复用
      # bash + tee：输出保存为日志（上传 artifacts），PIPESTATUS 保留 python 真实退出码
      - name: L1 单元测试（命名规范引擎）
        shell: bash
        run: python -m unittest discover -s tests/unit -t . -v 2>&1 | tee test-unit.log; exit ${PIPESTATUS[0]}
      - name: L2 集成测试（存储层 core；真实数据依赖用例自动跳过）
        shell: bash
        run: python -m unittest discover -s tests/integration -t . -v 2>&1 | tee test-integration.log; exit ${PIPESTATUS[0]}
      - name: L3 端到端测试（CLI 全流程）
        shell: bash
        run: python -m unittest discover -s tests/e2e -t . -v 2>&1 | tee test-e2e.log; exit ${PIPESTATUS[0]}

      # 测试报告 artifacts：无论成败均可下载查看（--if-no-files-found 忽略日志缺失）
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-*.log
          if-no-files-found: ignore

      # 失败通知：仅 main 分支（push/合并）失败时开 Issue（PR 失败属开发中，不打扰）
      - name: 失败通知（自动开 Issue）
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const open = await github.rest.issues.listForRepo({owner, repo, state:'open', labels:['ci-failure']});
            if (open.data.length > 0) {
              console.log('已有未关闭的 CI 失败 Issue，跳过');
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `CI 失败：${context.runId}`,
                body: `main 分支 CI 流水线失败，请查看：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                labels: ['ci-failure']
              });
              console.log('已创建 CI 失败 Issue');
            }

  # 静态编译检查：全部脚本可被 py_compile（防语法/导入回归）；双平台
  compile-check:
    # fork PR 来源限定：与 test-pyramid 一致
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: py_compile 全部脚本
        # Windows runner 默认 shell 是 PowerShell，不展开 *.py 通配符 → 显式用 bash（runner 自带）
        shell: bash
        run: |
          python -m py_compile scripts/bidcraft.py scripts/_shared/*.py scripts/m1_assets/*.py scripts/m2_template/*.py scripts/m4_tender/*.py scripts/m5_project/*.py scripts/m7_check/*.py scripts/m_feedback/*.py
