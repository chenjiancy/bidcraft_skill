name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 测试金字塔：L1 单元(最多最快) → L2 集成 → L3 端到端(最少最慢)
  test-pyramid:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 零外部依赖：全部基于 Python 标准库 unittest，保证跨环境/平台可复用
      - name: L1 单元测试（命名规范引擎）
        run: python -m unittest discover -s tests/unit -t . -v
      - name: L2 集成测试（存储层 core）
        run: python -m unittest discover -s tests/integration -t . -v
      - name: L3 端到端测试（CLI 全流程）
        run: python -m unittest discover -s tests/e2e -t . -v

  # 静态编译检查：全部脚本可被 py_compile（防语法/导入回归）
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: py_compile 全部脚本
        run: |
          python -m py_compile scripts/bidcraft.py scripts/_shared/*.py scripts/m1_assets/*.py
